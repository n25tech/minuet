<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Minuet is a minimalist productivity app designed to help you organize tasks, manage time precisely, and find your daily work rhythm.">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.svg" />
  <title class="timer-display">Minuet: a minimalist productivity app</title>
  <meta name="color-scheme" content="light dark">
  <!-- Not deferred: sets the theme before the page is drawn. -->
  <script src="js/theme.js?v=1"></script>
  <script src="js/config.js?v=2" defer></script>
  <script src="js/app.js?v=7" defer></script>
  <script src="js/pomodoro.js?v=3" defer></script>
  <script src="js/signin.js?v=5" defer></script>
  <script src="js/sync.js?v=5" defer></script>
  <script src="js/calendar-core.js?v=2" defer></script>
  <script src="js/tasks-core.js?v=2" defer></script>
  <!-- Built by scripts/build.js from src/markdown/ (a module: deferred, and run in order with the scripts around it). -->
  <script type="module" src="js/markdown.js"></script>
  <script src="js/notebook.js?v=8" defer></script>
  <script src="js/todolist.js?v=9" defer></script>
  <script src="js/diary.js?v=2" defer></script>
  <script src="js/calendar.js?v=4" defer></script>
  <script src="js/settings.js?v=2" defer></script>
  <link rel="stylesheet" href="assets/css/styles.css?v=5">
  <link rel="stylesheet" href="assets/css/light_theme.css?v=5">
  <link rel="stylesheet" href="assets/css/dark_theme.css?v=4">
  <link rel="stylesheet" href="assets/css/main_page.css?v=11">
  <link rel="stylesheet" href="assets/css/notebook.css?v=8">
  <link rel="stylesheet" href="assets/css/calendar.css?v=5">
  <link rel="stylesheet" href="assets/css/settings.css?v=1">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="app"></div>
  <!--TEMPLATES-->
  <!--MAIN PAGE TEMPLATE-->
  <template id="main-page-template">
    <div id="main-page" class="main-page">
      <nav class="navbar">
        <a href="#/" aria-label="Minuet home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
        </a>
        <h1 hidden="false">Minuet</h1>
        <span class="navbar-brand">Minuet</span>
        <div class="nav-tabs">
          <a href="#/pomodoro" data-nav="pomodoro">Pomodoro</a>
          <a href="#/notes" data-nav="notes">Notes</a>
          <a href="#/calendar" data-nav="calendar">Calendar</a>
          <a href="#/settings" data-nav="settings" aria-label="Settings"><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-text">Settings</span></a>
        </div>
        <div id="navbar-signin" class="navbar-signin">
          <button id="signin-toggle" class="signin-toggle" onclick="toggleSigninMenu()">Sign In ▾</button>
          <div id="signin-menu" class="signin-menu" hidden>
            <div id="signin-methods" class="signin-methods">
              <div id="google-signin-button" class="signin-method"></div>
              <!-- Add more authentication methods here -->
            </div>
            <div id="account-panel" class="account-panel" hidden>
              <span class="account-caption">Signed in as</span>
              <strong id="account-name" class="account-name"></strong>
              <span id="account-email" class="account-email"></span>
              <span class="account-caption">To-dos, notes and calendar sync across your devices.</span>
              <button class="signout-button" onclick="signOut()">Sign out</button>
            </div>
          </div>
        </div>
      </nav>
      <main class="views">
        <!-- POMODORO -->
        <section class="view view-pomodoro" data-view="pomodoro">
          <div class="left-column panel">
            <h3>To-do list</h3>
            <select id="pomodoro-list" class="pomodoro-note-picker" aria-label="Checklist to show" hidden></select>
            <div id="todolist-table-container" class="todo-items"></div>
            <form id="todo-form" class="todo-form">
              <input type="text" id="new-item-input" placeholder="New item" aria-label="New to-do item" enterkeyhint="enter">
              <label class="check" title="Show this to-do on the Calendar at a date and time">
                <input type="checkbox" id="new-item-calendar"> Add to calendar
              </label>
              <div class="todo-when" id="new-item-when" hidden>
                <input type="date" id="new-item-date" aria-label="Date">
                <input type="time" id="new-item-time" aria-label="Time (optional)">
                <select id="new-item-repeat" aria-label="Repeat">
                  <option value="">Does not repeat</option>
                  <option value="daily">Repeats daily</option>
                  <option value="weekly">Repeats weekly</option>
                  <option value="monthly">Repeats monthly</option>
                  <option value="yearly">Repeats yearly</option>
                </select>
                <select id="new-item-status" aria-label="Suggested or committed">
                  <option value="">Suggested (can be moved)</option>
                  <option value="committed">Committed (fixed time)</option>
                </select>
              </div>
              <button type="submit" class="primary">Add</button>
            </form>
            <button type="button" class="quiet" onclick="todoList.clearCompleted()">Clear completed</button>
          </div>
          <div class="center-top-column">
            <div class="pomodoro-card panel">
              <h3>Pomodoro</h3>
              <label class="field pomodoro-task">Working on
                <select id="pomodoro-task"></select>
              </label>
              <div class="field pomodoro-length">Length (minutes)
                <div id="pomodoro-durations" class="segmented pomodoro-durations" role="group" aria-label="Pomodoro length in minutes">
                  <button type="button" data-minutes="2" aria-label="2 minutes">2</button>
                  <button type="button" data-minutes="5" aria-label="5 minutes">5</button>
                  <button type="button" data-minutes="15" aria-label="15 minutes">15</button>
                  <button type="button" data-minutes="25" aria-label="25 minutes">25</button>
                  <button type="button" data-minutes="45" aria-label="45 minutes">45</button>
                  <button type="button" data-minutes="60" aria-label="60 minutes">60</button>
                </div>
              </div>
              <p id="pomodoro-timer-display">25:00</p>
              <button id="pomodoro-toggle-button" class="primary" onclick="pomodoroTimer.handleToggleBtn()">Start</button>
              <button onclick="pomodoroTimer.resetEngine()">Reset</button>
            </div>
          </div>
          <div class="right-column panel">
            <h3>Distraction diary</h3>
            <select id="diary-note" class="pomodoro-note-picker" aria-label="Note to show" hidden></select>
            <textarea id="notes-area" placeholder="Jot down distractions here and get back to work..."></textarea>
          </div>
        </section>

        <!-- NOTES -->
        <section class="view view-notes" data-view="notes" hidden>
          <div class="notes-toolbar">
            <div class="segmented" role="group" aria-label="Which notes to show">
              <button type="button" data-notes-scope="home">Home</button>
              <button type="button" data-notes-scope="all">All notes</button>
            </div>
            <input type="search" id="notes-search" placeholder="Search all notes" aria-label="Search all notes">
          </div>
          <div class="note-composer">
            <button type="button" id="notes-new-text" class="note-composer-text">Take a note...</button>
            <button type="button" id="notes-new-list" class="icon-button" title="New checklist" aria-label="New checklist"></button>
          </div>
          <div id="notes-labels" class="chip-row" aria-label="Filter by label"></div>
          <div id="notes-grid" class="notes-grid"></div>
        </section>

        <!-- CALENDAR -->
        <section class="view view-calendar" data-view="calendar" hidden>
          <div id="calendar-root" class="calendar"></div>
        </section>

        <!-- SETTINGS -->
        <section class="view view-settings" data-view="settings" hidden>
          <div class="panel settings-card">
            <h3>Appearance</h3>
            <p>Choose light or dark, or follow your device's setting. This is saved on this device.</p>
            <div id="settings-theme" class="segmented" role="group" aria-label="Theme">
              <button type="button" data-theme-choice="system">System</button>
              <button type="button" data-theme-choice="light">Light</button>
              <button type="button" data-theme-choice="dark">Dark</button>
            </div>
          </div>
          <div id="settings-signed-out" class="panel settings-card">
            <h3>Settings</h3>
            <p>Sign in to set your time zone and to let an AI assistant work with your notes and calendar. These need an account, because the assistant reaches Minuet through the server.</p>
          </div>
          <div id="settings-signed-in" hidden>
            <div class="panel settings-card">
              <h3>Time zone</h3>
              <p>Times in Minuet are stored as you type them, with no time zone. Assistants use this setting to know what “now” and “tomorrow at 3” mean for you.</p>
              <select id="settings-timezone" aria-label="Time zone"></select>
              <small id="settings-timezone-note"></small>
              <p id="settings-timezone-error" class="form-error" role="alert" hidden></p>
            </div>

            <div class="panel settings-card">
              <h3>AI access</h3>
              <p>An access token lets an AI assistant (through the Model Context Protocol) read and change your notes, to-dos and calendar, within the level you choose. You can revoke a token at any time.</p>
              <div id="settings-new-token" class="settings-new-token" hidden></div>
              <div id="settings-tokens" class="settings-list"></div>
              <form id="settings-token-form">
                <label class="field">Name, so you recognise it later
                  <input type="text" id="settings-token-name" maxlength="60" required placeholder="e.g. Claude on my phone">
                </label>
                <fieldset class="levels">
                  <legend>What it may do</legend>
                  <div id="settings-levels" class="levels"></div>
                </fieldset>
                <label class="field">Expires
                  <select id="settings-token-expiry">
                    <option value="30">In 30 days</option>
                    <option value="90" selected>In 90 days</option>
                    <option value="365">In a year</option>
                    <option value="0">Never</option>
                  </select>
                </label>
                <button type="submit" class="primary">Create token</button>
              </form>
              <p id="settings-token-error" class="form-error" role="alert" hidden></p>
            </div>

            <div class="panel settings-card">
              <div class="settings-head">
                <h3>Changes made with tokens</h3>
                <span class="spacer"></span>
                <button type="button" id="settings-history-refresh" class="quiet">Refresh</button>
              </div>
              <p>Everything an assistant changed, newest first. Undo puts the affected items back to how they were before that change.</p>
              <div id="settings-history" class="settings-list"></div>
              <p id="settings-history-error" class="form-error" role="alert" hidden></p>
            </div>
          </div>
        </section>
      </main>
      <footer class="app-footer">
        <a href="https://n25tech.com" target="_blank" rel="noopener">Built by n25tech</a>
      </footer>

      <dialog id="note-dialog" class="dialog note-dialog">
        <form id="note-form">
          <div class="note-head">
            <input type="text" id="note-title" placeholder="Title" aria-label="Title">
            <button type="button" id="note-pin" class="icon-button note-pin-toggle" aria-label="Show on Notes home"></button>
          </div>
          <div id="note-format" class="note-format" role="toolbar" aria-label="Formatting">
            <span id="note-format-tools" class="note-format-tools">
              <button type="button" data-format="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
              <button type="button" data-format="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
              <button type="button" data-format="strike" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
              <button type="button" data-format="heading" title="Heading" aria-label="Heading">H</button>
              <button type="button" data-format="bullet" title="Bulleted list" aria-label="Bulleted list">•</button>
              <button type="button" data-format="number" title="Numbered list" aria-label="Numbered list">1.</button>
              <button type="button" data-format="task" title="Checkbox" aria-label="Checkbox">☐</button>
              <button type="button" data-format="quote" title="Quote" aria-label="Quote">❝</button>
              <button type="button" data-format="code" title="Code" aria-label="Code">&lt;/&gt;</button>
              <button type="button" data-format="link" title="Link (Ctrl+K)" aria-label="Link">🔗</button>
            </span>
            <button type="button" id="note-split-toggle" class="note-preview-toggle" aria-pressed="true" title="Show the formatted note next to what you type">Side by side</button>
            <button type="button" id="note-preview-toggle" class="note-preview-toggle" aria-pressed="false">Preview</button>
          </div>
          <div id="note-body" class="note-body">
            <textarea id="note-text" rows="1" placeholder="Take a note... (Markdown works: **bold**, # heading, - list)" aria-label="Note"></textarea>
            <div id="note-preview" class="note-preview md" title="Click to edit" hidden></div>
          </div>
          <div id="note-items" class="note-items"></div>
          <div id="note-when" class="note-when" hidden>
            <span>On calendar</span>
            <input type="date" id="note-date" aria-label="Date">
            <input type="time" id="note-time" aria-label="Time (optional)">
            <select id="note-repeat" aria-label="Repeat">
                  <option value="">Does not repeat</option>
                  <option value="daily">Repeats daily</option>
                  <option value="weekly">Repeats weekly</option>
                  <option value="monthly">Repeats monthly</option>
                  <option value="yearly">Repeats yearly</option>
            </select>
            <select id="note-status" aria-label="Suggested or committed">
                  <option value="">Suggested (can be moved)</option>
                  <option value="committed">Committed (fixed time)</option>
            </select>
            <button type="button" id="note-when-remove" class="icon-button" title="Remove note from calendar" aria-label="Remove note from calendar"></button>
          </div>
          <div id="note-chips" class="note-card-labels"></div>
          <div id="note-panel-colors" class="swatches" role="group" aria-label="Colour" hidden></div>
          <label id="note-panel-labels" class="field" hidden>Labels (comma separated)
            <input type="text" id="note-labels" list="note-label-options" placeholder="e.g. work, ideas">
            <datalist id="note-label-options"></datalist>
          </label>
          <div class="note-bar">
            <button type="button" id="note-color-button" class="icon-button" title="Colour" aria-label="Colour"></button>
            <button type="button" id="note-label-button" class="icon-button" title="Labels" aria-label="Labels"></button>
            <div class="menu-wrap">
              <button type="button" id="note-settings" class="icon-button" title="Note options" aria-label="Note options" aria-haspopup="menu" aria-expanded="false"></button>
              <div id="note-menu" class="menu" role="menu" hidden>
                <button type="button" role="menuitem" id="note-toggle-list"></button>
                <button type="button" role="menuitem" id="note-toggle-calendar"></button>
                <button type="button" role="menuitem" id="note-delete" class="danger">Delete note</button>
              </div>
            </div>
            <span id="note-edited" class="note-edited"></span>
            <button type="submit" class="quiet">Close</button>
          </div>
        </form>
      </dialog>

      <dialog id="event-dialog" class="dialog event-dialog">
        <form id="event-form">
          <input type="text" id="event-title" class="dialog-title" placeholder="Add title" aria-label="Title">
          <div class="field-row">
            <label class="check"><input type="checkbox" id="event-allday"> All day</label>
            <span class="spacer"></span>
            <select id="event-status" aria-label="Suggested or committed">
              <option value="">Suggested (can be moved)</option>
              <option value="committed">Committed (fixed time)</option>
            </select>
          </div>
          <div class="field-row">
            <label class="field">Starts
              <span><input type="date" id="event-start-date" required> <input type="time" id="event-start-time"></span>
            </label>
            <label class="field">Ends
              <span><input type="date" id="event-end-date" required> <input type="time" id="event-end-time"></span>
            </label>
          </div>
          <div class="field-row">
            <label class="field">Repeat
              <select id="event-repeat">
                <option value="">Does not repeat</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </label>
            <label class="field" id="event-until-field">Until (optional)
              <input type="date" id="event-until">
            </label>
          </div>
          <div id="event-colors" class="swatches" role="group" aria-label="Colour"></div>
          <textarea id="event-description" placeholder="Description" aria-label="Description"></textarea>
          <fieldset id="event-scope" class="scope" hidden>
            <legend>This is a repeating event. Apply to</legend>
            <label class="check"><input type="radio" name="event-scope" value="this" checked> This event only</label>
            <label class="check"><input type="radio" name="event-scope" value="all"> All events in the series</label>
          </fieldset>
          <p id="event-error" class="form-error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button type="button" id="event-delete" class="danger">Delete</button>
            <span class="spacer"></span>
            <button type="button" id="event-cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </dialog>
    </div>
  </template>
</body>

</html>
